databases:
  - name: splitease-db
    plan: free
    databaseName: splitease_db
    user: splitease_user

services:
  - type: web
    name: splitease-api
    plan: free
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: splitease-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://splitease.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.0"
